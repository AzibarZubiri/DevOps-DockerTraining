services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secreto
      POSTGRES_DB: monitor
    volumes:
      - datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: monitor
      DB_USER: postgres
      DB_PASSWORD: secreto
    restart: unless-stopped

volumes:
  datos:

